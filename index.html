<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa Beisan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* يتعرف على صورة الخلفية الحالية بصيغتها المباشرة */
            background-color: #1a4444;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('background.jpg'), url('background.png'), url('background.jpeg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }

        .bio {
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f0f0f0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        .social-icons {
            display: flex;
            gap: 15px;
            margin-bottom: 35px;
        }

        .social-icons a {
            color: white;
            font-size: 1.4em;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .social-icons a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }

        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-btn {
            position: relative;
            width: 100%;
            padding: 18px 20px;
            min-height: 65px;
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .btn-icon {
            position: absolute;
            right: 10px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #333;
            font-size: 1.3em;
        }

        .btn-text {
            text-align: center;
            line-height: 1.3;
        }

        .btn-subtext {
            display: block;
            font-size: 0.8em;
            font-weight: normal;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- جلب اسم صورة الشعار بالضبط كما هي في مجلدك (هوا بيسان.png أو logo.png) -->
        <img src="هوا بيسان.png" onerror="this.onerror=null; this.src='logo.png';" alt="Hawa Beisan Logo" class="profile-logo">

        <h1>Hawa Beisan</h1>
        <p class="bio">أهلاً بكم في هوا بيسان ✨<br>أصالة الماضي بطعم اليوم</p>

        <div class="social-icons">
            <a href="https://www.instagram.com/hawabeisan/?hl=ar" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/962791007162" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="https://www.facebook.com/hawabesan/?locale=ar_AR" target="_blank"><i class="fab fa-facebook-f"></i></a>
        </div>

        <div class="links-list">
            <a href="https://hawabeisan.com/wp-content/uploads/2026/08/1-edited-t-1.pdf" class="link-btn" target="_blank">
                <div class="btn-icon"><i class="fas fa-utensils"></i></div>
                <span class="btn-text">Menu - القائمة</span>
            </a>

            <a href="https://www.instagram.com/hawabeisan/?hl=ar" class="link-btn" target="_blank">
                <div class="btn-icon"><i class="fab fa-instagram"></i></div>
                <div class="btn-text">
                    Instagram
                    <span class="btn-subtext">صور وفيديوهات هوا بيسان</span>
                </div>
            </a>

            <a href="https://wa.me/962791007162" class="link-btn" target="_blank">
                <div class="btn-icon"><i class="fab fa-whatsapp"></i></div>
                <span class="btn-text">WhatsApp</span>
            </a>

            <a href="https://www.facebook.com/hawabesan/?locale=ar_AR" class="link-btn" target="_blank">
                <div class="btn-icon"><i class="fab fa-facebook-f"></i></div>
                <span class="btn-text">Facebook</span>
            </a>

            <a href="https://share.google/arKfj2AN5MKgiC1Dq" class="link-btn" target="_blank">
                <div class="btn-icon"><i class="fab fa-google"></i></div>
                <span class="btn-text">Google Maps</span>
            </a>

            <a href="https://www.snapchat.com/place/hawa-beisan-/06627ffb-2167-4870-b633-d847c82e0c91" class="link-btn" target="_blank">
                <div class="btn-icon"><i class="fab fa-snapchat"></i></div>
                <span class="btn-text">Snapchat</span>
            </a>
        </div>
    </div>

</body>
</html>
